apiVersion: batch/v1
kind: CronJob
metadata:
  name: oaif-orchestrator-tick
spec:
  schedule: "*/10 * * * *"  # Scheduled tick fires every 10 minutes
  concurrencyPolicy: Forbid  # Prevents overlapping ticks and Git race conditions
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 300  # Hard timeout: 5 minutes max per tick
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          initContainers:
            - name: seed-git-repo
              image: oaif-agent:dev
              imagePullPolicy: IfNotPresent
              command: ["sh", "-c", "if [ ! -d /workspace/.git ]; then echo 'Seeding shared PVC from image...'; cp -a /app/. /workspace/; fi"]
              volumeMounts:
                - name: shared-repo
                  mountPath: /workspace
          containers:
            - name: oaif-worker
              image: oaif-agent:dev
              imagePullPolicy: IfNotPresent
              args: ["--spec-id", "SPEC-001", "--repo-root", "/workspace"]
              resources:
                requests:
                  memory: "256Mi"
                  cpu: "250m"
                limits:
                  memory: "512Mi"   # Strict defense against recursive generation or reward hacking
                  cpu: "500m"
              volumeMounts:
                - name: shared-repo
                  mountPath: /workspace
          volumes:
            - name: shared-repo
              persistentVolumeClaim:
                claimName: oaif-git-repo-pvc